<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0d0b24">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="Neon Horde: Survivor Arena — one-finger roguelite survivor. Auto-attack, evolve weapons, defeat bosses.">
  <title>Neon Horde: Survivor Arena</title>
  <link rel="preload" href="fonts/fredoka-500.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/fredoka-700.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <!-- Loading -->
    <section id="screen-loading" class="screen active">
      <div class="loading-logo">
        <div class="logo-word">NEON</div>
        <div class="logo-word logo-word-b">HORDE</div>
        <div class="logo-sub" data-i18n="subtitle">Survivor Arena</div>
      </div>
      <div class="loading-bar"><div class="loading-fill" id="loading-fill"></div></div>
      <div class="loading-text" data-i18n="loading">Loading…</div>
    </section>

    <!-- Lobby -->
    <section id="screen-lobby" class="screen">
      <header class="topbar" id="topbar"></header>
      <main class="lobby-content" id="lobby-content"></main>
      <nav class="bottom-nav" id="bottom-nav"></nav>
    </section>

    <!-- In-game -->
    <section id="screen-game" class="screen">
      <canvas id="game-canvas"></canvas>
      <div class="hud" id="hud">
        <div class="hud-top">
          <div class="xp-bar"><div class="xp-fill" id="hud-xp"></div><div class="xp-level" id="hud-level">Lv 1</div></div>
          <div class="hud-row">
            <div class="hud-kills"><span class="skull"></span><span id="hud-kills">0</span></div>
            <div class="hud-timer" id="hud-timer">00:00</div>
            <button class="hud-pause" id="hud-pause" aria-label="Pause"><span></span><span></span></button>
          </div>
          <div class="hud-skills" id="hud-skills"></div>
          <div class="boss-bar" id="boss-bar" hidden>
            <div class="boss-name" id="boss-name"></div>
            <div class="boss-track"><div class="boss-fill" id="boss-fill"></div></div>
          </div>
        </div>
        <div class="hud-coins"><span class="ico ico-coin"></span><span id="hud-coins">0</span></div>
        <div class="announce" id="announce"></div>
        <div class="tutorial-hint" id="tutorial-hint" hidden></div>
      </div>
    </section>

    <div id="modal-root"></div>
    <div id="toast-root"></div>
    <div id="fly-root"></div>
    <div id="web-banner" class="web-banner" hidden><span>AD</span> Banner 320×50 · web preview</div>
  </div>

  <script src="js/core/util.js"></script>
  <script src="js/core/config.js"></script>
  <script src="js/core/i18n.js"></script>
  <script src="js/core/save.js"></script>
  <script src="js/core/audio.js"></script>
  <script src="js/core/platform.js"></script>
  <script src="js/meta/meta.js"></script>
  <script src="js/game/world.js"></script>
  <script src="js/game/weapons.js"></script>
  <script src="js/game/enemies.js"></script>
  <script src="js/ui/input.js"></script>
  <script src="js/render/sprites.js"></script>
  <script src="js/render/fx.js"></script>
  <script src="js/render/renderer.js"></script>
  <script src="js/render/juice.js"></script>
  <script src="js/ui/ui.js"></script>
  <script src="js/ui/stage.js"></script>
  <script src="js/ui/lobby.js"></script>
  <script src="js/ui/run-ui.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
