<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Store screenshot frame</title>
<style>
  @font-face { font-family: 'Fredoka'; font-weight: 300 700; src: url('../../game/fonts/fredoka-latin.woff2') format('woff2'); }
  @font-face { font-family: 'Fredoka'; font-weight: 300 700; src: url('../../game/fonts/fredoka-latin-ext.woff2') format('woff2'); unicode-range: U+0100-02BA; }
  html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; }
  body {
    background: radial-gradient(ellipse at 50% 0%, #3b1f8f 0%, #150f3a 45%, #0d0b24 100%);
    font-family: Fredoka, sans-serif; color: #fff;
    display: flex; flex-direction: column; align-items: center;
  }
  .cap {
    height: 330px; width: 940px; display: flex; align-items: center; justify-content: center; text-align: center;
    font-size: 86px; font-weight: 700; line-height: 1.02; letter-spacing: 0.5px;
    text-shadow: 0 0 18px rgba(46, 242, 255, 0.75), 0 0 46px rgba(46, 242, 255, 0.35);
  }
  .cap > span { display: block; }
  .cap b { color: #ffc83d; text-shadow: 0 0 18px rgba(255, 200, 61, 0.8); }
  .phone {
    width: 846px; height: 1504px; border-radius: 64px; overflow: hidden; position: relative;
    box-shadow: 0 0 0 10px #231a57, 0 0 0 13px #4a3cae, 0 0 60px rgba(46, 242, 255, 0.35), 0 30px 80px rgba(0, 0, 0, 0.6);
  }
  .phone img { width: 100%; height: 100%; object-fit: cover; object-position: top; display: block; }
</style>
</head>
<body>
  <div class="cap" id="cap"></div>
  <div class="phone"><img id="shot" alt=""></div>
<script>
  const q = new URLSearchParams(location.search);
  // captions may highlight one phrase with *asterisks*
  document.getElementById('cap').innerHTML = '<span>' + (q.get('caption') || '').replace(/[<>&]/g, '').replace(/\*([^*]+)\*/g, '<b>$1</b>') + '</span>';
  const img = document.getElementById('shot');
  img.onload = () => document.fonts.ready.then(() => { document.body.dataset.ready = '1'; });
  img.src = q.get('img');
</script>
</body>
</html>
