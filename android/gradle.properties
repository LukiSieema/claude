org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# ---------------------------------------------------------------------------
# Google AdMob — IDs used by RELEASE builds.
# Debug builds ALWAYS use Google's official test ads (safe to click).
# Fill these in from your AdMob account (see docs/ADMOB_SETUP.md).
# A release build refuses to compile while these are empty, so you cannot
# accidentally publish with test ads. Override with -PallowTestAds=true for
# internal release testing only.
# ---------------------------------------------------------------------------
ADMOB_APP_ID=
ADMOB_BANNER_ID=
ADMOB_REWARDED_ID=
ADMOB_INTERSTITIAL_ID=

# BETA TESTING (closed/internal testing on Google Play): the release build uses Google's TEST ads
# while the IDs above are empty. Before the production release: fill in the 4 IDs and set this to false.
allowTestAds=true

# Optional: hashed test-device id printed by the UMP SDK in logcat.
# When set, debug builds show the EU consent form on that device.
UMP_TEST_DEVICE_ID=
